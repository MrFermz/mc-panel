syntax = "proto3";

package gamemanager.job.v1;

option go_package = "github.com/game-manager/proto/gen/go/gamemanager/job/v1;jobv1";

// Job messages วิ่งบน NATS JetStream (protobuf binary)
//
// Subjects:
//   gamemanager.jobs.{node_id}   control-plane -> agent (stream JOBS, pull consumer ต่อ node)
//   gamemanager.results          agent -> control-plane (stream RESULTS)
//
// DB (`jobs` table) เป็น source of truth ของสถานะงานเสมอ — NATS เป็นแค่ transport
// agent ต้อง ack หลังทำเสร็จ (สำเร็จหรือล้มเหลวก็ ack แล้วรายงานผ่าน JobResult)
// เพราะฉะนั้นงานทุกชนิดต้องเขียนแบบ idempotent — โดน redeliver ซ้ำต้องไม่พัง

message JobEnvelope {
  // 15 = import_server ที่ถูกถอดออก — จองไว้กัน field number ถูกใช้ซ้ำถ้าฟีเจอร์กลับมา
  reserved 15;

  string job_id = 1;    // UUID ของแถวใน jobs table
  string server_id = 2; // UUID ของ server ที่เกี่ยวข้อง
  oneof payload {
    CreateServer create_server = 10;
    StartServer start_server = 11;
    StopServer stop_server = 12;
    KillServer kill_server = 13;
    DeleteServer delete_server = 14;
  }
}

// CreateServer = provision: สร้าง directory, โหลด artifact จาก official source ของเกม,
// เขียน seed config / launch script — ยังไม่ start
//
// game เป็นตัวเลือก game definition ฝั่ง agent (registry เดียวกับ control-plane) ส่วน
// variant เป็นชนิดของ server ภายในเกมนั้น — ว่าง = game default (job เก่าที่ค้างใน stream
// ก่อนมี field นี้ต้อง provision ได้เหมือนเดิม)
message CreateServer {
  string variant = 1;        // ชนิดของ server ภายในเกม เช่น vanilla | paper | proxy
  string game_version = 2;   // เวอร์ชันของเกม เช่น "1.21.4"
  bool accept_license = 3;   // user ต้องติ๊กยอมรับ license ของเกมเองตอนสร้าง ห้าม default true
  string game = 4;           // game definition id — ว่าง = game default
}

message StartServer {
  int32 memory_mb = 1;    // hard limit ของทั้ง container — definition เป็นคนแปลงเป็น heap เอง
  int32 host_port = 2;    // 0 = ไม่ expose host port (เข้าถึงผ่าน proxy instance ใน network เดียวกัน)
  string docker_image = 3; // เช่น game-manager/runtime-java:21 — control-plane เลือกจาก definition
}

message StopServer {
  bool graceful = 1; // true = เขียน stop word เข้า stdin ก่อน แล้วรอ grace period
}

message KillServer {}

// DeleteServer: stop + ลบ container + ลบ directory ใต้ GM_DATA_DIR
// agent ต้อง validate path อยู่ใต้ GM_DATA_DIR ก่อน RemoveAll เสมอ
message DeleteServer {}

message JobResult {
  string job_id = 1;
  string server_id = 2;
  bool success = 3;
  string error = 4;  // ว่างถ้า success
  string detail = 5; // ข้อมูลเสริม เช่น checksum ของ artifact ที่โหลด
}
